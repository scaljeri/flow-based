<fb-normal-node>
  <section class="minified">
    <fb-default-front [title]="title"></fb-default-front>
  </section>

  <section class="config">
    <div class="card-wrapper">
      <mat-card class="form">
        <mat-card-content>
          <!--
            <fb-slider> rather than a bare Material slider, and it is not a
            cosmetic swap: pressing a node drags it, so a slider inside one used
            to move its thumb AND take the graph with it. The control carries
            fbNoDrag itself, which is the point — a node author should not have
            to know that a slider needs telling.
          -->
          <form [formGroup]="configForm">
            <fb-slider label="Start" formControlName="startValue"
                       [min]="worker.min" [max]="worker.max" step="0.1"></fb-slider>

            <fb-slider label="End" formControlName="endValue"
                       [min]="worker.min" [max]="worker.max" step="0.1"></fb-slider>

            <fb-slider label="Interval" formControlName="intervalValue"
                       [min]="worker.intervalMin" [max]="worker.intervalMax" step="100"></fb-slider>

            <label class="horizontal">
              <span class="large">Integers only</span>
              <mat-checkbox fbNoDrag formControlName="integersOnlyValue"></mat-checkbox>
            </label>
          </form>
        </mat-card-content>
      </mat-card>

      <mat-card class="output">
        <mat-card-header>
          <mat-card-title>Current value</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          {{currentValue}}
        </mat-card-content>
      </mat-card>
    </div>
  </section>
</fb-normal-node>
