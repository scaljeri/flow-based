<!--
The toolbar is three things: a menu on the left, a title that takes what is
left, and Add on the right.

Everything else lives in the menu, at every screen size. Splitting the actions
between an inline row and a fold-away menu meant maintaining two copies of the
same commands and a breakpoint to choose between them — and on a landscape
phone the inline row still filled the bar to its last twenty pixels. It also
put two unlabelled arrows on a touch screen: their tooltips only appear on
hover, and a phone has none, so download and upload were a guess. In the menu
every command carries its own words.

In embed mode (?embed=doc) the bar is gone entirely: the share link promises
the article alone, and an iframe on someone else's page has no business
showing this app's cockpit.
-->
@if (!embed) {
<mat-toolbar [color]="'primary'">
  <button type="button" mat-icon-button class="overflow" [matMenuTriggerFor]="overflowMenu"
    aria-label="Menu">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="title">Flow based programming</span>

  <!--
  Validation stays in the bar, alone among the commands: it is not something
  you go looking for, it is the editor telling you something is wrong, and an
  alert behind a menu is not an alert. It appears only when there is one.
  -->
  @if (problemCount > 0) {
    <button type="button" mat-button class="problems" [matTooltip]="validationDetail">
      <mat-icon>warning</mat-icon>
      {{problemCount}}
    </button>
  }

  <button type="button" mat-button (click)="openModal()" class="add">Add</button>

  <mat-menu #overflowMenu="matMenu">
    <button type="button" mat-menu-item class="undo" (click)="undo()" [disabled]="!history.canUndo()">
      <mat-icon>undo</mat-icon>
      <span>Undo</span>
    </button>

    <button type="button" mat-menu-item class="redo" (click)="redo()" [disabled]="!history.canRedo()">
      <mat-icon>redo</mat-icon>
      <span>Redo</span>
    </button>

    <mat-divider></mat-divider>

    <button type="button" mat-menu-item class="json" (click)="showJSON()">
      <mat-icon>data_object</mat-icon>
      <span>{{showJson ? 'Show flow' : 'Show JSON'}}</span>
    </button>

    <button type="button" mat-menu-item class="doc" (click)="toggleDoc()">
      <mat-icon>article</mat-icon>
      <span>{{showDoc ? 'Show flow' : 'Show document'}}</span>
    </button>

    <!-- Only while the document is up: the link it copies IS the document. -->
    @if (showDoc) {
      <button type="button" mat-menu-item class="share" (click)="copyShareLink()">
        <mat-icon>{{shareCopied ? 'check' : 'share'}}</mat-icon>
        <span>{{shareCopied ? 'Link copied' : 'Copy embed link'}}</span>
      </button>
    }

    <mat-divider></mat-divider>

    <button type="button" mat-menu-item class="save" (click)="save()">
      <mat-icon>download</mat-icon>
      <span>Download JSON</span>
    </button>

    <button type="button" mat-menu-item class="load" (click)="fileInput.click()">
      <mat-icon>upload</mat-icon>
      <span>Load JSON</span>
    </button>

    <mat-divider></mat-divider>

    <!-- Editor-wide settings live here; backends and the like will join them. -->
    <button type="button" mat-menu-item class="flows" (click)="openFlows()">
      <mat-icon>folder_open</mat-icon>
      <span>Flows</span>
    </button>

    <button type="button" mat-menu-item class="modules" (click)="openModules()">
      <mat-icon>extension</mat-icon>
      <span>Modules</span>
    </button>

    <button type="button" mat-menu-item class="type-colors" (click)="openTypeColors()">
      <mat-icon>palette</mat-icon>
      <span>Data types</span>
    </button>

    <mat-divider></mat-divider>

    <!-- Which build this phone is ACTUALLY showing; cache disputes end here. -->
    <div class="app-version">{{version}}</div>
  </mat-menu>

  <input #fileInput type="file" accept="application/json,.json" class="file-input"
    (change)="onLoad($event)" aria-label="Load a flow from a JSON file">
</mat-toolbar>
}

@if (loadError) {
  <p class="load-error" role="alert">Could not load that flow — {{loadError}}</p>
}

<main>
  <!--
  Hidden, not destroyed, while another representation is on screen: the editor
  and its workers live in this component, and the document's figures are those
  workers' live output.

  Embedded, it also stays hidden until the document has been up once: opening
  the document awaits a dynamic KaTeX import, and until that resolved the
  canvas was on screen — an embedded article flashed the editor first. After
  that the document's own button may send the reader here.
  -->
  <fb-flow [flow]="flow" [class.view-hidden]="flowHidden"></fb-flow>

  @if (showJson) {
    <article class="flow-as-json">
      <!-- The versioned envelope, i.e. exactly what the download writes. -->
      <pre>{{flowJson}}</pre>
    </article>
  }

  @if (showDoc) {
    <!--
    The document can ask for things the app decides on: `{{!flow:...}}` in the
    prose becomes a button, and this is where "flow" is given its meaning.
    -->
    <fb-flow-document class="flow-as-doc" [editor]="editor" [mathRenderer]="mathRenderer"
      (fb-doc-action)="onDocAction($event)"></fb-flow-document>
  }

  <!--
  Embedded, there is no toolbar to go back with — so the way back is offered
  where the reader is. Only after the document has sent them to the flow.
  -->
  @if (embed && !showDoc && !flowHidden) {
    <button type="button" class="back-to-doc" (click)="toggleDoc()">← Back to the article</button>
  }
</main>
