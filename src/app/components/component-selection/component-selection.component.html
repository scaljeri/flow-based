<mat-toolbar color="primary">
  <span>Component selection</span>

  <button type="button" mat-icon-button class="close" aria-label="Close" (click)="onClose()">
    <mat-icon>close</mat-icon>
  </button>
</mat-toolbar>

<section class="type-selection">
  <mat-form-field class="search">
    <mat-label>Search flow units</mat-label>
    <input matInput type="search" autocomplete="off" cdkFocusInitial
      [ngModel]="query" (ngModelChange)="onQuery($event)" (keyup.enter)="onEnter()">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="list">
    @for (group of groups; track group.name) {
      <section class="group-block">
        <h3 class="group">{{group.name}}</h3>

        @for (key of group.keys; track key) {
          <button type="button" class="item" (click)="onSelection(key)">{{title(key)}}</button>
        }
      </section>
    }

    @if (empty) {
      <p class="no-matches">No flow unit matches &ldquo;{{query}}&rdquo;.</p>
    }
  </div>
</section>
