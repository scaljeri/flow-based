<!--
  No edit branch and no pencil.
  Title, sockets and socket colours are model, and the shell's own settings panel
  edits them for every node type — including ones this app never sees. Keeping a
  second, app-local editor beside it would mean two ways to do the same thing,
  disagreeing the moment either changed.
-->
<header *ngIf="isActive">
  <mat-toolbar color="primary">
    <h1>{{title}}</h1>
  </mat-toolbar>
</header>

<ng-content></ng-content>

<footer *ngIf="isActive">
  <button mat-button color="warn" (click)="onDelete()">
    <mat-icon>delete_forever</mat-icon>
  </button>

  <button mat-button (click)="onClose()" class="close">Close</button>
</footer>
