<mat-card class="title">
  <mat-card-content>
    <mat-form-field>
      <mat-label>Title</mat-label>
      <input matInput placeholder="Title" [(ngModel)]="state.title">
    </mat-form-field>
  </mat-card-content>
</mat-card>

<div class="socket-wrapper" *ngIf="hasSockets()">
  <div class="socket-list socket-in">
    <div class="socket-row" *ngFor="let socket of sockets | socketIn;let i = index">
      <button *ngIf="deleteSocket" #action mat-mini-fab color="warn" (click)="onDelete(socket, i)" [attr.data-socket-id]="socket.id"
              class="action">
        <mat-icon>delete_forever</mat-icon>
      </button>

      <button *ngIf="!deleteSocket" #action mat-mini-fab color="primary" [attr.data-socket-id]="socket.id"
              class="action socket-direction">
        <mat-icon>arrow_right_alt</mat-icon>
      </button>

      <mat-form-field>
        <mat-label>Socket name</mat-label>
        <input matInput placeholder="Socket name" [(ngModel)]="socket.name">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Colors</mat-label>
        <input matInput type="color" (ngModelChange)="setSocketColor($event, socket)"
               [ngModel]="getSocketColor(socket)">
      </mat-form-field>
    </div>
  </div>

  <div class="socket-list socket-out">
    <div class="socket-row" *ngFor="let socket of sockets | socketOut;let i = index">
      <button *ngIf="deleteSocket" #action mat-mini-fab color="warn" (click)="onDelete(socket, i)" [attr.data-socket-id]="socket.id"
              class="action">
        <mat-icon>delete_forever</mat-icon>
      </button>

      <button *ngIf="!deleteSocket" #action mat-mini-fab color="primary" [attr.data-socket-id]="socket.id"
              class="action socket-direction">
        <mat-icon>arrow_right_alt</mat-icon>
      </button>

      <mat-form-field>
        <mat-label>Socket name</mat-label>
        <input matInput placeholder="Socket name" [(ngModel)]="socket.name">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Colors</mat-label>
        <input matInput type="color" (ngModelChange)="setSocketColor($event, socket)"
               [ngModel]="getSocketColor(socket)">
      </mat-form-field>
      <mat-divider></mat-divider>
    </div>
  </div>
</div>
