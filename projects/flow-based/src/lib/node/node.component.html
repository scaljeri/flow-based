<section class="component">
  <ng-container *ngIf="isFlow() && isFullSize()">
    <fb-flow-based #flow [state]="state" [active]="true" [root]="false" (clicked)="onClick($event)"></fb-flow-based>
  </ng-container>

  <fb-connection-lines *ngIf="!!service.connections"
                        [connections]="service.connections"
                        [class.is-dark]="isFlow()" class="tmp-lines"></fb-connection-lines>

  <ng-container *fbDynamicComponent="state"></ng-container>

  <section class="sockets sockets-in" [class.is-disabled]="isFullSize() && !isFlow()">
    <fb-socket *ngFor="let socket of sockets | socketIn"
                [state]="socket"
                [scope]="getScope()"
                [invert]="isInverted()"
                [parent]="id"
                [attr.data-socket-id]="socket.id"
                class="socket"></fb-socket>
  </section>

  <section class="sockets sockets-out" [class.is-disabled]="isFullSize() && !isFlow()">
    <fb-socket *ngFor="let socket of sockets | socketOut"
                [state]="socket"
                [scope]="getScope()"
                [invert]="isInverted()"
                [parent]="id"
                class="socket"></fb-socket>
  </section>

  <ng-container *ngIf="isLabel()">
    <span class="title" *ngIf="!isFullSize()">{{state.title}}</span>
  </ng-container>
</section>
