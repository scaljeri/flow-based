<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>flow-based — web-component shell</title>
  <style>
    body { background:#000; color:#eee; font:14px system-ui; margin:0; }
    #app { background:#000; }
    header { align-items:center; background:#3f51b5; display:flex; gap:12px; padding:8px 12px; }
    #app { height: calc(100vh - 45px); }
  
    .react-node { background: #20232a; color: #61dafb; font: 12px system-ui; padding: 10px 14px; text-align: center; min-width: 96px; }
    .react-node-title { font-size: 11px; opacity: .7; }
    .react-node-ticks { font-size: 22px; line-height: 1.2; }
    .react-node-hint { font-size: 10px; opacity: .5; }
  </style>
</head>
<body>
  <header>
    <strong>Lit shell</strong>
    <button id="view">Document</button>
    <button id="add">Add</button>
    <button id="undo">Undo</button>
    <button id="routing">Straight</button>
    <button id="zoom-out">−</button>
    <button id="reset">reset</button>
    <span id="zoom">100%</span>
    <button id="zoom-in">+</button>
    <span>nodes: <span id="nodes">0</span></span>
  </header>
  <div id="app"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
